<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Thiamson Comptage</title>
    <style>
        :root {
            --primary: #1e40af;
            --primary-dark: #1e3a8a;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --border-color: #cbd5e1;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        header {
            text-align: center;
        }

        h1 {
            color: var(--primary);
            font-size: 1.4rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        p.subtitle {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 2px;
        }

        .result-card {
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            color: white;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 4px 14px rgba(30,64,175,0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .result-card .title-detected {
            font-size: 0.95rem;
            font-weight: 600;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .result-card .value {
            font-size: 3.8rem;
            font-weight: 900;
            line-height: 1;
            margin: 6px 0;
        }

        .result-card .status-tag {
            font-size: 0.75rem;
            background: rgba(255,255,255,0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 500;
        }

        .btn-upload {
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            text-align: center;
            background: var(--primary);
            color: white;
            width: 100%;
            display: block;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(30,64,175,0.2);
            transition: transform 0.1s;
        }

        .btn-upload:active {
            transform: scale(0.98);
        }

        .btn {
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            text-align: center;
            background: var(--primary);
            color: white;
            width: 100%;
        }

        .btn-danger {
            background: var(--danger);
            box-shadow: 0 4px 12px rgba(239,68,68,0.2);
        }

        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            box-shadow: none;
            padding: 10px;
            font-size: 0.88rem;
        }

        input[type="file"] {
            display: none;
        }

        .workspace {
            position: relative;
            width: 100%;
            height: 380px;
            background: #0f172a;
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed var(--border-color);
            touch-action: none;
        }

        .placeholder {
            color: #94a3b8;
            text-align: center;
            padding: 24px;
            font-size: 0.9rem;
            line-height: 1.5;
            position: absolute;
        }

        canvas {
            display: block;
            cursor: crosshair;
        }

        .mode-selector {
            display: flex;
            gap: 8px;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 12px;
        }

        .mode-btn {
            flex: 1;
            padding: 8px;
            border: none;
            background: transparent;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
        }

        .mode-btn.active {
            background: white;
            color: var(--primary);
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        .instructions {
            font-size: 0.8rem;
            color: #475569;
            background: #f1f5f9;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
        }

        .zoom-controls {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .zoom-btn {
            background: #e2e8f0;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            color: #334155;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Thiamson Comptage</h1>
            <p class="subtitle">Analyse visuelle & Zoom Tactile</p>
        </header>

        <div class="result-card">
            <div class="title-detected" id="status-title">Total Sélectionné</div>
            <div class="value" id="count-display">0</div>
            <div class="status-tag" id="status-tag">Prêt pour la photo</div>
        </div>

        <label for="file-input" class="btn-upload">
            📷 Prendre une photo / Importer
        </label>
        <input type="file" id="file-input" accept="image/*" capture="environment" onchange="loadPhoto(event)">

        <div class="zoom-controls" id="zoom-controls" style="display: none;">
            <button class="zoom-btn" onclick="adjustZoom(-0.25)">🔍- Dézoomer</button>
            <button class="zoom-btn" onclick="resetZoom()">1:1 Réinitialiser Zoom</button>
            <button class="zoom-btn" onclick="adjustZoom(0.25)">🔍+ Zoomer</button>
        </div>

        <div class="workspace" id="workspace">
            <div class="placeholder" id="placeholder">
                Prenez une photo. Vous pourrez zoomer et toucher chaque objet pour le compter proprement un par un.
            </div>
            <canvas id="photo-canvas" style="display: none;"></canvas>
        </div>

        <div class="instructions" id="instructions" style="display: none;">
            Zoomez si besoin, puis touchez les rouleaux ou bêtes pour ajouter un repère numéroté.
        </div>

        <div style="display: flex; gap: 8px;">
            <button class="btn btn-outline" id="undo-btn" onclick="undoLastMark()" style="display: none; flex: 1;">↩ Annuler dernier</button>
            <button class="btn btn-danger" onclick="resetAll()" style="flex: 1;">🔄 Tout effacer</button>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const canvas = document.getElementById('photo-canvas');
        const ctx = canvas.getContext('2d');
        const workspace = document.getElementById('workspace');
        const countDisplay = document.getElementById('count-display');
        const statusTitle = document.getElementById('status-title');
        const statusTag = document.getElementById('status-tag');
        const placeholder = document.getElementById('placeholder');
        const instructions = document.getElementById('instructions');
        const undoBtn = document.getElementById('undo-btn');
        const zoomControls = document.getElementById('zoom-controls');

        let currentImage = null;
        let marks = [];
        let scale = 1;
        let offsetX = 0;
        let offsetY = 0;
        let isDragging = false;
        let startX, startY;

        function loadPhoto(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    currentImage = img;
                    canvas.width = workspace.clientWidth;
                    canvas.height = workspace.clientHeight;
                    
                    // Centrer l'image au départ en mode "fit"
                    const hRatio = canvas.width / img.width;
                    const vRatio = canvas.height / img.height;
                    scale = Math.min(hRatio, vRatio);
                    
                    offsetX = (canvas.width - img.width * scale) / 2;
                    offsetY = (canvas.height - img.height * scale) / 2;

                    placeholder.style.display = 'none';
                    canvas.style.display = 'block';
                    instructions.style.display = 'block';
                    zoomControls.style.display = 'flex';

                    marks = [];
                    redrawCanvas();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function redrawCanvas() {
            if (!currentImage) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(offsetX, offsetY);
            ctx.scale(scale, scale);

            // Dessiner l'image originale
            ctx.drawImage(currentImage, 0, 0);

            // Dessiner les repères de comptage
            marks.forEach((mark, index) => {
                const radius = Math.max(14, 18 / scale);

                ctx.beginPath();
                ctx.arc(mark.x, mark.y, radius, 0, 2 * Math.PI);
                ctx.fillStyle = '#ef4444';
                ctx.fill();
                ctx.lineWidth = 3 / scale;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = `bold ${radius * 1.1}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(index + 1, mark.x, mark.y);
            });

            ctx.restore();

            countDisplay.innerText = marks.length;
            statusTitle.innerText = "Total Sélectionné";
            statusTag.innerText = marks.length > 0 ? "Comptage en cours" : "Touchez pour compter";
            undoBtn.style.display = marks.length > 0 ? 'block' : 'none';
        }

        function adjustZoom(amount) {
            if (!currentImage) return;
            scale = Math.max(0.5, Math.min(5, scale + amount));
            redrawCanvas();
        }

        function resetZoom() {
            if (!currentImage) return;
            const hRatio = canvas.width / currentImage.width;
            const vRatio = canvas.height / currentImage.height;
            scale = Math.min(hRatio, vRatio);
            offsetX = (canvas.width - currentImage.width * scale) / 2;
            offsetY = (canvas.height - currentImage.height * scale) / 2;
            redrawCanvas();
        }

        // Gestion du tactile et de la souris pour déplacer ou pointer
        let pointerDownTime = 0;
        let pointerStartX = 0;
        let pointerStartY = 0;

        canvas.addEventListener('pointerdown', (e) => {
            if (!currentImage) return;
            isDragging = true;
            pointerDownTime = Date.now();
            pointerStartX = e.clientX;
            pointerStartY = e.clientY;
            startX = e.clientX - offsetX;
            startY = e.clientY - offsetY;
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDragging || !currentImage) return;
            offsetX = e.clientX - startX;
            offsetY = e.clientY - startY;
            redrawCanvas();
        });

        canvas.addEventListener('pointerup', (e) => {
            if (!currentImage) return;
            isDragging = false;
            
            // Si on a peu bougé et cliqué rapidement, on ajoute un point de comptage !
            const moveDistance = Math.abs(e.clientX - pointerStartX) + Math.abs(e.clientY - pointerStartY);
            const clickDuration = Date.now() - pointerDownTime;

            if (moveDistance < 8 && clickDuration < 300) {
                const rect = canvas.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;

                // Transformer les coordonnées écran en coordonnées réelles sur l'image zoomée
                const imgX = (clickX - offsetX) / scale;
                const imgY = (clickY - offsetY) / scale;

                // Vérifier si le clic est bien sur l'image
                if (imgX >= 0 && imgX <= currentImage.width && imgY >= 0 && imgY <= currentImage.height) {
                    marks.push({ x: imgX, y: imgY });
                    redrawCanvas();
                }
            }
        });

        function undoLastMark() {
            if (marks.length > 0) {
                marks.pop();
                redrawCanvas();
            }
        }

        function resetAll() {
            currentImage = null;
            marks = [];
            canvas.style.display = 'none';
            placeholder.style.display = 'block';
            instructions.style.display = 'none';
            zoomControls.style.display = 'none';
            undoBtn.style.display = 'none';
            countDisplay.innerText = '0';
            statusTitle.innerText = "Total Sélectionné";
            statusTag.innerText = "Prêt pour la photo";
            fileInput.value = '';
        }
    </script>
</body>
</html>
